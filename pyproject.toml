[project]
name = "fluxfold"
version = "0.1.0"
description = "An agent memory system that spends LLM cost on the write path and keeps search as vector retrieval."
readme = "README.md"
authors = [
    { name = "Floatato", email = "2264667392@qq.com" },
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "onnxruntime>=1.22",
    "openai>=1.68",
    "pydantic>=2.10",
    "socksio>=1.0.0",
    "tokenizers>=0.21",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E",
    "F",
    "I",
    "UP",
    "W",
]

[tool.mypy]
python_version = "3.12"
packages = ["fluxfold"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=fluxfold",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["fluxfold"]
